[theme]
primaryColor = "#14213D"
backgroundColor = "#F3F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14213D"
font = "sans serif"

[server]
# Streamlit Cloud: "auto" hit "inotify instance limit reached"; "none" kept running old code after a git pull
# (the build id changed, the screens didn't). "poll" reloads changed files without inotify.
fileWatcherType = "poll"
