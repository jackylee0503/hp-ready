[theme]
primaryColor = "#14213D"
backgroundColor = "#F3F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14213D"
font = "sans serif"

[server]
# Streamlit Cloud: the file watcher hit "inotify instance limit reached" and the app stopped updating.
# Locally, run with --server.fileWatcherType auto if you want hot reload while editing app.py.
fileWatcherType = "none"
