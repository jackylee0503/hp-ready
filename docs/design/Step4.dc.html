<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 4: is this right?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14213D}a:hover{color:#0B1328}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #F3F5F7; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 18px; font-family: 'Inter', system-ui, sans-serif; color: #14213D">

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Step3.dc.html" aria-label="Back" style="display: flex; align-items: center; min-height: 32px; min-width: 32px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<span style="font-size: 13px; font-weight: 600; color: #4A5565">4 of 4</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
<div style="height: 5px; border-radius: 3px; background: {{accent}}"></div>
<div style="height: 5px; border-radius: 3px; background: {{accent}}"></div>
<div style="height: 5px; border-radius: 3px; background: {{accent}}"></div>
<div style="height: 5px; border-radius: 3px; background: {{accent}}"></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em">Is this right?</h1>
<p style="margin: 0; font-size: 15px; color: #4A5565">Tap to fix.</p>
</div>

<div style="background: #FFFFFF; border: 1px solid #E2E6EA; border-radius: 16px; padding: 2px 16px; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
<button type="button" aria-label="{{row.aria}}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 6px 0; border: none; border-bottom: {{row.border}}; background: transparent; font-family: inherit; color: #14213D; text-align: left">
<span style="font-size: 14px; color: #4A5565">{{row.label}}</span>
<span style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 15px; font-weight: 600; text-align: right">{{row.value}}</span>
<span style="font-size: 11px; font-weight: 600; color: #4A5565; background: #EEF1F4; border-radius: 999px; padding: 3px 7px; white-space: nowrap">{{row.source}}</span>
</span>
</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 15px; font-weight: 600; color: #1E5E37">✓ No questions for you</p>
<button type="button" onClick="{{toggleWhen}}" aria-expanded="{{whenOpen}}" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 32px; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #14213D">
When do we ask?
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{whenChev}}; transition: transform 0.15s"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<sc-if value="{{whenOpen}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; color: #4A5565; line-height: 1.45">Only when something missing or contradictory would change your answer, at most twice. Like: "Your text says oil, the bill says gas. Which one is it?"</p>
</sc-if>
</div>

<div style="flex: 1"></div>
<a href="Answer.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700">Show my answer</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14213D","options":["#14213D","#1E5B8A","#1E7A46"]},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const whenOpen = !!s.when;
    const rows = [
      { label: 'Built', value: '1972', source: 'text' },
      { label: 'Area', value: '140 m²', source: 'text' },
      { label: 'Insulation', value: 'Partly', source: 'text' },
      { label: 'Radiators', value: '10, large?', source: 'text' },
      { label: 'Pipes', value: 'Two-pipe?', source: 'photo' },
      { label: 'Gas', value: '18,002 kWh', source: 'bill' },
      { label: 'People', value: '3', source: 'text' }
    ];
    return {
      accent: this.props.accent ?? '#14213D',
      whenOpen,
      whenChev: whenOpen ? 'rotate(90deg)' : 'none',
      toggleWhen: () => this.setState({ when: !whenOpen }),
      rows: rows.map((r, i) => ({
        ...r,
        aria: 'Edit ' + r.label.toLowerCase() + ': ' + r.value,
        border: i === rows.length - 1 ? 'none' : '1px solid #EEF1F4'
      }))
    };
  }
}
</script>
</body>
</html>
