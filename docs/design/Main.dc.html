<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 1: your house</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14213D}a:hover{color:#0B1328}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F3F5F7; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 18px; font-family: 'Inter', system-ui, sans-serif; color: #14213D">

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; color: #4A5565">1 of 4</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
<div style="height: 5px; border-radius: 3px; background: {{accent}}"></div>
<div style="height: 5px; border-radius: 3px; background: #D5DBE1"></div>
<div style="height: 5px; border-radius: 3px; background: #D5DBE1"></div>
<div style="height: 5px; border-radius: 3px; background: #D5DBE1"></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em">Tell us about your house</h1>
<p style="margin: 0; font-size: 15px; color: #4A5565">Year, size, heating. Whatever you know.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="desc" style="font-size: 13px; font-weight: 600; color: #4A5565">Your house</label>
<textarea id="desc" rows="5" value="{{text}}" onChange="{{noop}}" style="box-sizing: border-box; width: 100%; padding: 12px; border: 1.5px solid #C9D0D8; border-radius: 14px; font-family: inherit; font-size: 16px; line-height: 1.45; color: #14213D; background: #FFFFFF; resize: none"></textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 13px; font-weight: 600; color: #1E5E37">✓ We read</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E6EA">1972</span>
<span style="font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E6EA">140 m²</span>
<span style="font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E6EA">Terraced</span>
<span style="font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E6EA">Partly insulated</span>
<span style="font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E6EA">Gas ~18,000 kWh</span>
<span style="font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E6EA">10 radiators</span>
<span style="font-size: 14px; font-weight: 600; padding: 5px 9px; border-radius: 999px; background: transparent; border: 1.5px dashed #9AA5B1; color: #4A5565">Large?</span>
</div>
</div>

<button type="button" style="min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed #9AA5B1; border-radius: 14px; background: transparent; color: #14213D; font-family: inherit; font-size: 15px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Photo of the outside <span style="font-weight: 500; color: #4A5565">· optional</span>
</button>

<div style="flex: 1"></div>
<a href="Step2.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700">Next</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14213D","options":["#14213D","#1E5B8A","#1E7A46"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#14213D',
      text: 'Terraced house from 1972, about 140 m². New windows in 2015, roof insulated. Gas heating, roughly 18,000 kWh a year, three of us. 10 radiators, the big flat ones.',
      noop: () => {}
    };
  }
}
</script>
</body>
</html>
