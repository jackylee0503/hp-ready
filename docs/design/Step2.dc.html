<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 2: radiator photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14213D}a:hover{color:#0B1328}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F3F5F7; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 18px; font-family: 'Inter', system-ui, sans-serif; color: #14213D">

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Back" style="display: flex; align-items: center; min-height: 32px; min-width: 32px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<span style="font-size: 13px; font-weight: 600; color: #4A5565">2 of 4</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
<div style="height: 5px; border-radius: 3px; background: {{accent}}"></div>
<div style="height: 5px; border-radius: 3px; background: {{accent}}"></div>
<div style="height: 5px; border-radius: 3px; background: #D5DBE1"></div>
<div style="height: 5px; border-radius: 3px; background: #D5DBE1"></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em">Your biggest radiator</h1>
<p style="margin: 0; font-size: 15px; color: #4A5565">From the side, pipes in view.</p>
</div>

<img src="/_blob/3ef8d7eb6a00493a84b189c90a44c9f6" alt="Your photo: a panel radiator with a thermostatic valve on top and two pipes going into the floor" style="width: 100%; height: 280px; object-fit: cover; object-position: center 30%; border-radius: 16px; display: block">

<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 13px; font-weight: 600; color: #1E5E37">✓ We read</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E6EA">Panel radiator</span>
<span style="font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E6EA">Two-pipe likely</span>
<span style="font-size: 14px; font-weight: 600; padding: 5px 9px; border-radius: 999px; background: transparent; border: 1.5px dashed #9AA5B1; color: #4A5565">Size?</span>
</div>
<button type="button" onClick="{{toggleWhy}}" aria-expanded="{{whyOpen}}" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 32px; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #14213D">
Why?
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{whyChev}}; transition: transform 0.15s"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<sc-if value="{{whyOpen}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; color: #4A5565; line-height: 1.45">Two-pipe: valve on top, separate return below, two pipes into the floor. Size: from the front we can't count the panels or see the full width.</p>
</sc-if>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #EAF1F8; border-radius: 14px; padding: 10px 10px 10px 14px">
<p style="margin: 0; font-size: 14px; font-weight: 600">Size unclear. One side shot?</p>
<button type="button" style="min-height: 44px; padding: 0 14px; border: 1.5px solid #14213D; border-radius: 12px; background: #FFFFFF; color: #14213D; font-family: inherit; font-size: 15px; font-weight: 600">Retake</button>
</div>

<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<a href="Step3.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700">Next</a>
<a href="Step3.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 15px; font-weight: 600">Skip</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14213D","options":["#14213D","#1E5B8A","#1E7A46"]},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const whyOpen = !!s.why;
    return {
      accent: this.props.accent ?? '#14213D',
      whyOpen,
      whyChev: whyOpen ? 'rotate(90deg)' : 'none',
      toggleWhy: () => this.setState({ why: !whyOpen })
    };
  }
}
</script>
</body>
</html>
